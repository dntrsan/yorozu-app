name: Yorozu
options:
  bundleIdPrefix: dev.yorozu
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.3.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Yorozu:
    type: application
    platform: iOS
    sources:
      - Yorozu
      - Shared
    dependencies:
      - target: YorozuLiveActivity
      # CI が llama.cpp の公式 xcframework を Frameworks/ に置く
      - framework: Frameworks/llama.xcframework
        embed: true
        codeSign: true
      - sdk: Accelerate.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
    info:
      path: Yorozu/Info.plist
      properties:
        CFBundleDisplayName: よろず
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # ファイルAppの「このiPhone内 > よろず」に GGUF を直接置けるようにする
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        # ダイナミックアイランド常駐(ライブアクティビティ)
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        CFBundleURLTypes:
          - CFBundleURLName: dev.yorozu.app
            CFBundleURLSchemes:
              - yorozu
    entitlements:
      path: Yorozu/Yorozu.entitlements
      properties:
        com.apple.developer.kernel.increased-memory-limit: true
        com.apple.developer.kernel.extended-virtual-addressing: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.yorozu.app
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_BITCODE: NO

  YorozuLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - LiveActivity
      - Shared
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: ActivityKit.framework
    info:
      path: LiveActivity/Info.plist
      properties:
        CFBundleDisplayName: よろず
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.yorozu.app.LiveActivity
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
