name: Build iOS (unsigned IPA)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # 空なら llama.cpp の最新リリースを使う。ビルドが通ったらタグ(例: b6900)を固定すると安定する
  LLAMA_TAG: ""

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Install tools
        run: brew install xcodegen ldid

      - name: Fetch llama.cpp xcframework
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p tmp/dl tmp/x Frameworks
          echo "== recent llama.cpp releases =="
          gh api 'repos/ggml-org/llama.cpp/releases?per_page=30' \
            --jq '.[] | "\(.tag_name)  \([.assets[].name] | map(select(test("xcframework|apple|ios"; "i"))) | join(", "))"' | head -n 15 || true

          TAG="$LLAMA_TAG"
          if [ -z "$TAG" ]; then
            # 最新リリースに xcframework が付いてるとは限らないので、付いてる一番新しいものを探す
            TAG="$(gh api 'repos/ggml-org/llama.cpp/releases?per_page=30' \
              --jq '[.[] | select(any(.assets[]; .name | test("xcframework"; "i")))][0].tag_name // ""')"
          fi
          echo "llama.cpp tag: ${TAG:-<none>}"

          if [ -n "$TAG" ] && gh release download "$TAG" --repo ggml-org/llama.cpp --pattern '*xcframework*' --dir tmp/dl; then
            for f in tmp/dl/*; do
              case "$f" in *.zip) unzip -q "$f" -d tmp/x ;; *.tar.gz|*.tgz) tar -xzf "$f" -C tmp/x ;; esac
            done
          else
            echo "prebuilt xcframework not found -> building from source"
            git clone --depth 1 ${TAG:+--branch "$TAG"} https://github.com/ggml-org/llama.cpp tmp/src
            (cd tmp/src && ./build-xcframework.sh)
            cp -R tmp/src/build-apple/llama.xcframework tmp/x/
          fi

          FW="$(find tmp/x -type d -name 'llama.xcframework' | head -n1)"
          test -n "$FW"
          mv "$FW" Frameworks/llama.xcframework
          ls Frameworks/llama.xcframework

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (no signing)
        run: |
          set -euo pipefail
          xcodebuild \
            -project Yorozu.xcodeproj \
            -scheme Yorozu \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/Yorozu.app"
          # 未署名ビルドでは entitlements が入らないので ldid で擬似署名して埋め込む
          ldid -SYorozu/Yorozu.entitlements "$APP/Yorozu" || echo "ldid failed (entitlements not embedded)"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry Yorozu.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Yorozu-ipa
          path: Yorozu.ipa
