name: Build iOS (unsigned IPA)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # 空なら llama.cpp の最新リリースを使う。ビルドが通ったらタグ(例: b6900)を固定すると安定する
  LLAMA_TAG: ""

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install xcodegen ldid

      - name: Fetch llama.cpp xcframework
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${LLAMA_TAG:-$(gh api repos/ggml-org/llama.cpp/releases/latest --jq .tag_name)}"
          echo "llama.cpp tag: $TAG"
          mkdir -p tmp/dl tmp/x Frameworks
          gh release download "$TAG" --repo ggml-org/llama.cpp --pattern '*xcframework*.zip' --dir tmp/dl
          unzip -q tmp/dl/*.zip -d tmp/x
          FW="$(find tmp/x -type d -name 'llama.xcframework' | head -n1)"
          test -n "$FW"
          mv "$FW" Frameworks/llama.xcframework
          ls Frameworks/llama.xcframework

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (no signing)
        run: |
          set -euo pipefail
          xcodebuild \
            -project Yorozu.xcodeproj \
            -scheme Yorozu \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/Yorozu.app"
          # 未署名ビルドでは entitlements が入らないので ldid で擬似署名して埋め込む
          ldid -SYorozu/Yorozu.entitlements "$APP/Yorozu" || echo "ldid failed (entitlements not embedded)"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry Yorozu.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Yorozu-ipa
          path: Yorozu.ipa
